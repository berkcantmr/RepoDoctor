name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build RepoDoctor.sln -c Release
      - run: dotnet test RepoDoctor.sln -c Release --no-build
      - run: dotnet pack src/RepoDoctor/RepoDoctor.csproj -c Release --no-build
      - name: Validate package installation
        run: |
          dotnet tool install RepoDoctor.Tool --version 0.2.0 --tool-path ./.smoke-tools --add-source ./artifacts
          ./.smoke-tools/repodoctor scan . --strict
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.0 artifacts/*.nupkg --target "$GITHUB_SHA" --title "RepoDoctor v0.2.0" --notes-file docs/release-v0.2.0.md
