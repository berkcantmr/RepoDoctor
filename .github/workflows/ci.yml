name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: tests/RepoDoctor.Tests/RepoDoctor.Tests.csproj

      - name: Restore dependencies
        run: dotnet restore RepoDoctor.sln

      - name: Build
        run: dotnet build RepoDoctor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RepoDoctor.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Pack tool
        run: dotnet pack src/RepoDoctor/RepoDoctor.csproj --configuration Release --no-build

      - name: Install and smoke test packaged tool
        shell: pwsh
        run: |
          dotnet tool install RepoDoctor.Tool --version 0.2.0 --tool-path ./.smoke-tools --add-source ./artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.smoke-tools/repodoctor --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.smoke-tools/repodoctor scan . --strict --format json --output smoke-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content smoke-report.json -Raw | ConvertFrom-Json
          if ($report.score -ne 100) { throw 'Self scan must score 100' }

      - name: Upload package and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            TestResults/
            smoke-report.json
